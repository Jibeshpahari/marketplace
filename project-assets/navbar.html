<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-w: 240px;
            --sidebar-collapsed: 64px;
            --topbar-h: 58px;
            --subnav-h: 44px;
            --bg-dark: #0f1117;
            --bg-dark2: #161822;
            --bg-dark3: #1e2030;
            --accent: #C2EEFF;
            --accent-dim: rgba(194, 238, 255, 0.13);
            --accent-dark: #0a4a6e;
            --text-light: #f0f0f4;
            --text-muted: #b0bcd8;
            --text-dim: #606880;
            --content-bg: #f2fbff;
            --white: #ffffff;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 10px;
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'DM Sans', sans-serif;
            background: var(--content-bg);
        }

        /* ─── SIDEBAR ─────────────────────────────────────────── */
        #sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            transition: width var(--transition);
            z-index: 100;
            overflow: hidden;
        }

        #sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 18px;
            height: var(--topbar-h);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: #0a4a6e;
            box-shadow: 0 0 14px rgba(194, 238, 255, 0.45);
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: var(--text-light);
            letter-spacing: 0.3px;
        }

        .logo-text span {
            color: var(--accent);
        }

        .sidebar-toggle {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: var(--bg-dark3);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all var(--transition);
            z-index: 10;
        }

        .sidebar-toggle:hover {
            background: var(--accent);
            color: #0a4a6e;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(194, 238, 255, 0.4);
        }

        .sidebar-toggle i {
            transition: transform var(--transition);
        }

        #sidebar.collapsed .sidebar-toggle i {
            transform: rotate(180deg);
        }

        .nav-section {
            padding: 20px 0 8px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nav-section::-webkit-scrollbar {
            width: 3px;
        }

        .nav-section::-webkit-scrollbar-thumb {
            background: var(--text-dim);
            border-radius: 2px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 0 20px 8px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity var(--transition);
        }

        #sidebar.collapsed .nav-label {
            opacity: 0;
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 40px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all var(--transition);
            user-select: none;
            white-space: nowrap;
            border-radius: 0;
            gap: 12px;
        }

        .nav-item:hover {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-item.active {
            color: var(--accent);
            background: var(--accent-dim);
            text-shadow: 0 0 10px rgba(194, 238, 255, 0.1);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 22px;
            background: var(--accent);
            border-radius: 0 3px 3px 0;
        }

        .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .nav-text {
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: 1.2%;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #sidebar.collapsed .nav-text,
        #sidebar.collapsed .nav-badge,
        #sidebar.collapsed .nav-arrow {
            display: none;
        }

        .nav-badge {
            background: var(--accent);
            color: #0a4a6e;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .nav-arrow {
            font-size: 10px;
            color: var(--text-dim);
            transition: transform var(--transition);
        }

        .nav-item.open .nav-arrow {
            transform: rotate(90deg);
            color: var(--text-muted);
        }

        .sub-menu {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
        }

        .sub-menu.open {
            max-height: 300px;
        }

        #sidebar.collapsed .sub-menu {
            display: none;
        }

        .sub-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px 0 48px;
            height: 34px;
            color: var(--text-muted);
            font-size: 13.2px;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .sub-item:hover {
            color: var(--text-light);
        }

        .sub-item.active {
            color: var(--accent);
        }

        .sub-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            opacity: 0.5;
        }

        .sub-item.active .sub-dot {
            opacity: 1;
        }

        /* tooltip on collapse */
        #sidebar.collapsed .nav-item:hover::after {
            content: attr(data-tip);
            position: absolute;
            left: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-dark3);
            color: var(--text-light);
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 6px;
            white-space: nowrap;
            border: 1px solid var(--border);
            pointer-events: none;
            z-index: 200;
        }

        /* ─── MAIN WRAPPER ─────────────────────────────────────── */
        #main {
            margin-left: var(--sidebar-w);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left var(--transition);
        }

        body.collapsed #main {
            margin-left: var(--sidebar-collapsed);
        }

        /* ─── TOP BAR ──────────────────────────────────────────── */
        #topbar {
            height: var(--topbar-h);
            background: var(--white);
            border-bottom: 1px solid #eaecf4;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            flex-shrink: 0;
        }

        .search-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 420px;
        }

        .search-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #aab;
            font-size: 13px;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            height: 34px;
            border: 1.5px solid #e4e6f0;
            border-radius: 20px;
            padding: 0 14px 0 36px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: #333;
            background: #f8f9fc;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input::placeholder {
            color: #aab;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(194, 238, 255, 0.35);
        }

        .search-box .search-kbd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 3px;
        }

        .kbd {
            background: #eee;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 10px;
            padding: 1px 4px;
            color: #888;
            font-family: monospace;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1.5px solid #e4e6f0;
            background: #f8f9fc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5272;
            font-size: 14px;
            transition: all 0.2s;
            position: relative;
        }

        .top-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #fff;
        }

        .notif-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            background: #e24b4a;
            border-radius: 50%;
            border: 1.5px solid #fff;
        }

        .avatar-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            background: linear-gradient(135deg, #C2EEFF, #5ec9f5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
            border: 2px solid #e4e6f0;
            transition: all 0.2s;
            color: #0a4a6e;
        }

        .avatar-btn:hover {
            border-color: var(--accent);
        }

        /* ─── SUB NAVBAR ───────────────────────────────────────── */
        #subnav {
            height: var(--subnav-h);
            background: var(--white);
            border-bottom: 1px solid #eaecf4;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 4px;
            flex-shrink: 0;
        }

        .subnav-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 12px;
            height: 32px;
            font-size: 13px;
            color: #4a5272;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.18s;
            white-space: nowrap;
            user-select: none;
        }

        .subnav-item:hover {
            color: #333;
            background: #f5f6fa;
        }

        .subnav-item.active {
            color: #333;
            font-weight: 500;
        }

        .subnav-item.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-dark);
            border-radius: 2px 2px 0 0;
        }

        .subnav-item i {
            font-size: 11px;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            min-width: 170px;
            background: #fff;
            border: 1px solid #eaecf4;
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            overflow: hidden;
            z-index: 200;
            padding: 4px 0;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .dd-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            font-size: 12.5px;
            color: #444;
            cursor: pointer;
            transition: background 0.15s;
        }

        .dd-item:hover {
            background: #f5f6fa;
            color: #111;
        }

        .dd-item i {
            width: 14px;
            color: #7888aa;
            font-size: 12px;
        }

        .dd-sep {
            height: 1px;
            background: #eaecf4;
            margin: 4px 0;
        }

        .subnav-right {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }

        .sub-action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 12px;
            height: 28px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.18s;
            border: 1.5px solid #e4e6f0;
            background: #fff;
            color: #555;
            font-family: 'DM Sans', sans-serif;
        }

        .sub-action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .sub-action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #0a4a6e;
            font-weight: 500;
            box-shadow: 0 0 12px rgba(194, 238, 255, 0.4);
        }

        .sub-action-btn.primary:hover {
            background: #a8e4ff;
            border-color: #a8e4ff;
            box-shadow: 0 0 18px rgba(194, 238, 255, 0.6);
        }

        /* ─── CONTENT AREA ─────────────────────────────────────── */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 28px 40px;
            background: var(--content-bg);
        }

        #content::-webkit-scrollbar {
            width: 5px;
        }

        #content::-webkit-scrollbar-thumb {
            background: #d0d3e0;
            border-radius: 3px;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #111;
            letter-spacing: -0.3px;
        }

        .page-sub {
            font-size: 13px;
            color: #8c8fa5;
            margin-top: 3px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aab;
            margin-bottom: 6px;
        }

        .breadcrumb span {
            color: #888;
        }

        .breadcrumb .sep {
            color: #d0d3e0;
        }

        .breadcrumb .current-active-page {
            color: #0f1117;
            font-weight: 500;
            letter-spacing: 1.2%;
        }

        /* SKELETON */
        @keyframes shimmer {
            0% {
                background-position: -600px 0;
            }

            100% {
                background-position: 600px 0;
            }
        }

        .skel {
            background: linear-gradient(90deg, #e8eaf0 25%, #f0f2f8 50%, #e8eaf0 75%);
            background-size: 600px 100%;
            animation: shimmer 1.6s infinite linear;
            border-radius: 6px;
        }

        /* STAT CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #eaecf4;
            border-radius: var(--radius);
            padding: 20px 20px 16px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .stat-card:nth-child(1)::after {
            background: #C2EEFF;
            box-shadow: 0 0 8px rgba(194, 238, 255, 0.6);
        }

        .stat-card:nth-child(2)::after {
            background: #96DCFF;
        }

        .stat-card:nth-child(3)::after {
            background: #6FD0FF;
        }

        .stat-card:nth-child(4)::after {
            background: #3BBFFA;
        }

        .skel-label {
            height: 11px;
            width: 60%;
            margin-bottom: 12px;
        }

        .skel-value {
            height: 28px;
            width: 45%;
            margin-bottom: 10px;
        }

        .skel-sub {
            height: 10px;
            width: 75%;
        }

        /* TABLE CARD */
        .table-card {
            background: #fff;
            border: 1px solid #eaecf4;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #eaecf4;
        }

        .skel-title {
            height: 14px;
            width: 140px;
        }

        .skel-btn {
            height: 28px;
            width: 90px;
            border-radius: 6px;
        }

        .table-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid #f5f6fa;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .skel-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .skel-text-sm {
            height: 11px;
            border-radius: 4px;
        }

        .skel-badge {
            height: 22px;
            border-radius: 20px;
        }

        /* GRID SECTION */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .skel-chart {
            height: 180px;
            border-radius: 8px;
            margin: 16px 20px;
        }

        .skel-donut {
            height: 150px;
            width: 150px;
            border-radius: 50%;
            margin: 20px auto;
        }

        .skel-legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 20px 20px;
        }

        .skel-leg-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skel-leg-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* MINI CARDS ROW */
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .mini-card {
            background: #fff;
            border: 1px solid #eaecf4;
            border-radius: var(--radius);
            padding: 16px;
        }

        /* responsive tweaks */
        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .mini-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- SUB NAVBAR -->
    <div id="subnav">
    
        <div class="subnav-item active">Overview</div>
    
        <div class="dropdown">
            <div class="subnav-item">
                Reports <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dd-item"><i class="fa-regular fa-file-chart-column"></i>Sales Report</div>
                <div class="dd-item"><i class="fa-regular fa-chart-pie"></i>Revenue Breakdown</div>
                <div class="dd-item"><i class="fa-regular fa-users"></i>User Metrics</div>
                <div class="dd-sep"></div>
                <div class="dd-item"><i class="fa-regular fa-clock-rotate-left"></i>Scheduled Reports</div>
            </div>
        </div>
    
        <div class="dropdown">
            <div class="subnav-item">
                Marketing <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dd-item"><i class="fa-regular fa-envelope"></i>Campaigns</div>
                <div class="dd-item"><i class="fa-regular fa-bullhorn"></i>Ads Manager</div>
                <div class="dd-item"><i class="fa-brands fa-instagram"></i>Social Media</div>
            </div>
        </div>
    
        <div class="dropdown">
            <div class="subnav-item">
                Finance <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
                <div class="dd-item"><i class="fa-regular fa-receipt"></i>Invoices</div>
                <div class="dd-item"><i class="fa-regular fa-credit-card"></i>Payments</div>
                <div class="dd-item"><i class="fa-regular fa-file-invoice-dollar"></i>Tax Records</div>
                <div class="dd-sep"></div>
                <div class="dd-item"><i class="fa-regular fa-arrow-down-to-line"></i>Export</div>
            </div>
        </div>
    
        <div class="subnav-item">Integrations</div>
        <div class="subnav-item">Logs</div>
    
        <div class="subnav-right">
            <button class="sub-action-btn"><i class="fa-solid fa-filter"></i> Filter</button>
            <button class="sub-action-btn"><i class="fa-solid fa-arrow-down-to-line"></i> Export</button>
            <button class="sub-action-btn primary"><i class="fa-solid fa-plus"></i> New</button>
        </div>
    
    </div>

    <script>
        $(function () {

            // Sidebar toggle
            $('#sidebarToggle').on('click', function () {
                $('#sidebar').toggleClass('collapsed');
                $('body').toggleClass('collapsed');
            });

            // Nav items with sub-menus
            $('.has-sub').on('click', function () {
                var $item = $(this);
                var $sub = $item.next('.sub-menu');
                var isOpen = $item.hasClass('open');

                // Close others
                $('.has-sub.open').not($item).removeClass('open');
                $('.sub-menu.open').not($sub).removeClass('open');

                $item.toggleClass('open', !isOpen);
                $sub.toggleClass('open', !isOpen);
            });

            // Regular nav items activate
            $('.nav-item:not(.has-sub)').on('click', function () {
                $('.nav-item').removeClass('active');
                $(this).addClass('active');
            });

            // Sub-item activate
            $('.sub-item').on('click', function (e) {
                e.stopPropagation();
                $('.sub-item').removeClass('active');
                $(this).addClass('active');
            });

            // Subnav items activate
            $('.subnav-item:not(:has(.fa-chevron-down))').on('click', function () {
                $('.subnav-item').removeClass('active');
                $(this).addClass('active');
            });

            // Keyboard shortcut for search
            $(document).on('keydown', function (e) {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                    e.preventDefault();
                    $('#searchInput').focus();
                }
                if (e.key === 'Escape') $('#searchInput').blur();
            });

            // Open Analytics sub on load for demo
            $('.has-sub').first().next('.has-sub').trigger('click');

        });
    </script>

</body>

</html>
