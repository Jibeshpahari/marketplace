<style>
*{box-sizing:border-box;margin:0;padding:0}
h2.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.wrap{padding:1.5rem 0}
.demo-row{display:flex;align-items:center;gap:24px;padding:18px 0;border-bottom:.5px solid var(--color-border-tertiary)}
.demo-row:last-child{border-bottom:none}
.demo-label{min-width:160px}
.demo-label p{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.demo-label span{font-size:12px;color:var(--color-text-tertiary)}
.sbadge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;min-width:36px;text-align:center;transition:all .2s}
.on-b{background:#d4f5e6;color:#0a7a42}
.off-b{background:var(--color-background-secondary);color:var(--color-text-tertiary)}

.ts{position:relative;display:inline-block;width:82px;height:42px;cursor:pointer;flex-shrink:0}
.ts input{display:none}
.ts-bg{position:absolute;inset:0;border-radius:21px;background:#e0e0e0;box-shadow:inset 0 0 0 2px #ccc;transition:background .35s,box-shadow .35s}
.ts input:checked ~ .ts-bg{background:#05c46b;box-shadow:inset 0 0 0 2px #04b360}
.ts-handle{position:absolute;top:5px;left:5px;width:32px;height:32px;background:#fff;border-radius:50%;z-index:3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ts-handle-inner{position:absolute;inset:0;border-radius:50%;transition:background .3s;background:transparent;z-index:0}
.on .ts-handle-inner{background:rgba(5,196,107,.08)}
.icon-canvas{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.x-line{stroke:#e24b4a;stroke-width:2.5;stroke-linecap:round}
.chk{stroke:#05c46b;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:22;stroke-dashoffset:22}

/* ── V1: smooth elastic flip both ways ── */
.v1 .ts-handle{transition:transform .42s cubic-bezier(0.34,1.5,0.64,1)}
.v1 input:checked ~ .ts-handle{transform:translateX(40px)}
.v1 .ic-x{transform-origin:center;transform:rotateY(0deg);opacity:1;transition:transform .32s cubic-bezier(0.55,0,1,0.45),opacity .18s}
.v1 .ic-ck{transform-origin:center;transform:rotateY(90deg);opacity:0;transition:transform .32s cubic-bezier(0,0.55,0.45,1) .1s,opacity .15s .1s}
.v1.on .ic-x{transform:rotateY(-90deg);opacity:0;transition:transform .32s cubic-bezier(0.55,0,1,0.45),opacity .18s}
.v1.on .ic-ck{transform:rotateY(0deg);opacity:1;transition:transform .32s cubic-bezier(0,0.55,0.45,1) .1s,opacity .15s .1s}

/* ── V2: Y-axis flip (top/bottom) ── */
.v2 .ts-handle{transition:transform .42s cubic-bezier(0.34,1.5,0.64,1)}
.v2 input:checked ~ .ts-handle{transform:translateX(40px)}
.v2 .ic-x{transform-origin:center;transform:rotateX(0deg);opacity:1;transition:transform .28s ease-in,opacity .15s}
.v2 .ic-ck{transform-origin:center;transform:rotateX(-90deg);opacity:0;transition:transform .3s cubic-bezier(0.22,1.5,0.64,1) .1s,opacity .15s .1s}
.v2.on .ic-x{transform:rotateX(90deg);opacity:0;transition:transform .28s ease-in,opacity .15s}
.v2.on .ic-ck{transform:rotateX(0deg);opacity:1;transition:transform .3s cubic-bezier(0.22,1.5,0.64,1) .1s,opacity .15s .1s}

/* ── V3: Z spin (clockwise/counter) ── */
.v3 .ts-handle{transition:transform .42s cubic-bezier(0.34,1.5,0.64,1)}
.v3 input:checked ~ .ts-handle{transform:translateX(40px)}
.v3 .ic-x{transform-origin:center;transform:rotate(0deg) scale(1);opacity:1;transition:transform .28s cubic-bezier(0.55,0,1,0.45),opacity .18s}
.v3 .ic-ck{transform-origin:center;transform:rotate(-90deg) scale(0.6);opacity:0;transition:transform .3s cubic-bezier(0.22,1.5,0.64,1) .08s,opacity .15s .08s}
.v3.on .ic-x{transform:rotate(90deg) scale(0.6);opacity:0;transition:transform .28s cubic-bezier(0.55,0,1,0.45),opacity .18s}
.v3.on .ic-ck{transform:rotate(0deg) scale(1);opacity:1;transition:transform .3s cubic-bezier(0.22,1.5,0.64,1) .08s,opacity .15s .08s}
</style>

<h2 class="sr-only">Three toggle switch variants with smooth X to checkmark animations</h2>

<div class="wrap">

  <div class="demo-row">
    <div class="demo-label">
      <p>Notifications</p>
      <span>Smooth X-axis flip</span>
    </div>
    <label class="ts v1" id="ts1" aria-label="Notifications toggle">
      <input type="checkbox" id="c1">
      <div class="ts-bg"></div>
      <div class="ts-handle">
        <div class="ts-handle-inner"></div>
        <div class="icon-canvas ic-x">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line class="x-line" x1="4" y1="4" x2="12" y2="12"/>
            <line class="x-line" x1="12" y1="4" x2="4" y2="12"/>
          </svg>
        </div>
        <div class="icon-canvas ic-ck">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <polyline class="chk" points="3,8.5 6.5,12 13,5"/>
          </svg>
        </div>
      </div>
    </label>
    <span class="sbadge off-b" id="b1">Off</span>
  </div>

  <div class="demo-row">
    <div class="demo-label">
      <p>Dark mode</p>
      <span>Y-axis flip (over top)</span>
    </div>
    <label class="ts v2" id="ts2" aria-label="Dark mode toggle">
      <input type="checkbox" id="c2">
      <div class="ts-bg"></div>
      <div class="ts-handle">
        <div class="ts-handle-inner"></div>
        <div class="icon-canvas ic-x">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line class="x-line" x1="4" y1="4" x2="12" y2="12"/>
            <line class="x-line" x1="12" y1="4" x2="4" y2="12"/>
          </svg>
        </div>
        <div class="icon-canvas ic-ck">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <polyline class="chk" points="3,8.5 6.5,12 13,5"/>
          </svg>
        </div>
      </div>
    </label>
    <span class="sbadge off-b" id="b2">Off</span>
  </div>

  <div class="demo-row">
    <div class="demo-label">
      <p>Auto-save</p>
      <span>Z spin swap</span>
    </div>
    <label class="ts v3" id="ts3" aria-label="Auto-save toggle">
      <input type="checkbox" id="c3">
      <div class="ts-bg"></div>
      <div class="ts-handle">
        <div class="ts-handle-inner"></div>
        <div class="icon-canvas ic-x">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line class="x-line" x1="4" y1="4" x2="12" y2="12"/>
            <line class="x-line" x1="12" y1="4" x2="4" y2="12"/>
          </svg>
        </div>
        <div class="icon-canvas ic-ck">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <polyline class="chk" points="3,8.5 6.5,12 13,5"/>
          </svg>
        </div>
      </div>
    </label>
    <span class="sbadge off-b" id="b3">Off</span>
  </div>

</div>

<script>
function setup(cbId, wrapId, badgeId) {
  const cb = document.getElementById(cbId);
  const wrap = document.getElementById(wrapId);
  const badge = document.getElementById(badgeId);
  const chks = wrap.querySelectorAll('.chk');

  function apply(on, animate) {
    if (on) {
      wrap.classList.add('on');
      badge.textContent = 'On';
      badge.className = 'sbadge on-b';
      chks.forEach(c => {
        c.style.transition = animate ? 'stroke-dashoffset .35s ease .15s, opacity .2s' : 'none';
        c.style.strokeDashoffset = '0';
      });
    } else {
      wrap.classList.remove('on');
      badge.textContent = 'Off';
      badge.className = 'sbadge off-b';
      chks.forEach(c => {
        c.style.transition = animate ? 'stroke-dashoffset .22s ease, opacity .18s' : 'none';
        c.style.strokeDashoffset = '22';
      });
    }
  }

  apply(cb.checked, false);
  cb.addEventListener('change', () => apply(cb.checked, true));
}

setup('c1','ts1','b1');
setup('c2','ts2','b2');
setup('c3','ts3','b3');
</script>
